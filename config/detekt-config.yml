naming:
 FunctionNaming:
   ignoreAnnotated: [ 'Composable' ]
 TopLevelPropertyNaming:
   constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
 LongParameterList:
   functionThreshold: 15
   ignoreDefaultParameters: true

 LongMethod:
   active: false

style:
 MagicNumber:
   active: false
 UnusedPrivateMember:
   ignoreAnnotated: [ 'Preview' ]
